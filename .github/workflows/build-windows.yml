name: Build Zain's Demon

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Download JUCE
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git "${{ github.workspace }}/JUCE"

      - name: Configure
        run: cmake -S . -B build -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release

      - name: Find VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
          if ($null -eq $vst3) {
            Write-Error "VST3 bulunamadı."
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "VST3 bulundu: $($vst3.FullName)"

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $vst3 = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
          Compress-Archive -Path $vst3.FullName -DestinationPath "artifacts/Zains-Demon-VST3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Zains-Demon-VST3
          path: artifacts/Zains-Demon-VST3.zip
